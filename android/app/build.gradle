import java.nio.file.Files
import java.security.MessageDigest

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Android versionCode is maintained in version.properties (auto-incremented by the
// pre-commit hook, see .githooks/pre-commit). versionName still comes from pubspec.
def buildNumberFile = rootProject.file('version.properties')
def buildVersionCode = 2026
if (buildNumberFile.exists()) {
    def props = new Properties()
    buildNumberFile.withInputStream { props.load(it) }
    buildVersionCode = (props.'versionCode' ?: '2026') as int
}

android {
    namespace = "nini22p.iris"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "nini22p.iris"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = buildVersionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        // Shared debug keystore (committed to VCS for team-wide consistency)
        debug {
            storeFile = rootProject.file('app/debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    // Some author may need to create different variants of the app
    // and install them on the same device at the same time.
    // Thus use a flavor dimension called "funcVer".
    flavorDimensions "funcVer"

    productFlavors {
        nini22p {
            dimension "funcVer"
            applicationIdSuffix ".nini22p"
        }
        tifi7 {
            dimension "funcVer"
            applicationIdSuffix ".tifi7"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            // Use the shared debug keystore so all team builds share the same debug signature
            signingConfig = signingConfigs.debug
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}


task downloadFiles(type: Exec) {
    def filesToDownload = [
        [
            "url": "https://github.com/notofonts/noto-cjk/raw/refs/heads/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Medium.otf",
            "md5": "58c83279d990b2cf88d40a0a34832e31",
            "destination": file("./src/main/assets/flutter_assets/assets/fonts/NotoSansCJKsc-Medium.otf")
        ]
    ]

    filesToDownload.each { fileInfo ->
        def destFile = fileInfo.destination

        if (destFile.exists()) {
           def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

            if (calculatedMD5 != fileInfo.md5) {
                destFile.delete()
                println "MD5 mismatch. File deleted: ${destFile}"
            }
        }

        if (!destFile.exists()) {
             destFile.parentFile.mkdirs()
            println "Downloading file from: ${fileInfo.url}"
            destFile.withOutputStream { os ->
                os << new URL(fileInfo.url).openStream()
            }

             def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
            if (calculatedMD5 != fileInfo.md5) {
                throw new GradleException("MD5 verification failed for ${destFile}")
            }
        }
    }
}

assemble.dependsOn(downloadFiles)